# Builds this fork into a Docker image and publishes it to GitHub Container Registry.
#
# Triggered by pushing a tag such as `8.9.0-custom.1`, or manually. The image is
# `ghcr.io/<owner>/rocket.chat:<tag>`, a drop-in replacement for the official one in
# rocketchat-compose (`IMAGE=ghcr.io/<owner>/rocket.chat`, `RELEASE=<tag>`).
# See docs/custom-image.md.
name: Custom image

on:
  push:
    tags:
      - '*-custom.*'
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  bundle:
    name: Build Meteor bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable Yarn 4
        run: corepack enable

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/?release=$(sed 's/METEOR@//' apps/meteor/.meteor/release) | sh
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      # The image runs on Alpine (musl) while the runner is glibc: fetch native binaries for
      # both so the bundle can be trimmed to the musl ones before the Docker build.
      - name: Fetch native binaries for glibc and musl
        run: |
          yarn config set supportedArchitectures --json '{"os": ["linux"], "cpu": ["x64"], "libc": ["glibc", "musl"]}'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace packages
        run: yarn build

      - name: Build Meteor bundle
        working-directory: apps/meteor
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          yarn build:ci
          find /tmp/dist/bundle -type f -name '*.d.ts' -delete
          cp .docker/Dockerfile.alpine /tmp/dist/Dockerfile

      - name: Pack bundle
        run: tar -C /tmp/dist -czf /tmp/Rocket.Chat.tar.gz bundle Dockerfile

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: /tmp/Rocket.Chat.tar.gz
          retention-days: 3

  image:
    name: Build and push image
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: /tmp/build

      - name: Unpack bundle
        run: tar -C /tmp/build -xzf /tmp/build/Rocket.Chat.tar.gz && rm /tmp/build/Rocket.Chat.tar.gz

      - name: Keep only linuxmusl-x64 native binaries
        run: |
          NM=/tmp/build/bundle/programs/server/npm/node_modules
          find "$NM/@img" -type d -name 'sharp-*' -not -name '*-linuxmusl-x64' -exec rm -rf {} + 2>/dev/null || true
          find "$NM/@napi-rs" -type d -name 'pinyin-linux-*' -not -name '*-linux-x64-*' -exec rm -rf {} + 2>/dev/null || true
          find "$NM/@esbuild" -type d -name 'linux-*' -not -name '*-x64' -exec rm -rf {} + 2>/dev/null || true
          find "$NM/@rocket.chat/apps/node_modules/@esbuild" -type d -name 'linux-*' -not -name '*-x64' -exec rm -rf {} + 2>/dev/null || true
          ls "$NM/@img"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="manual-${{ github.run_number }}"; fi
          echo "image=ghcr.io/${OWNER}/rocket.chat" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: /tmp/build
          file: /tmp/build/Dockerfile
          target: release-standard
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
